<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Panel de Música por Día — PULSO 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background-color:#51155D;
    background-image:url('fondo.jpg');
    background-size:cover;background-position:center top;background-repeat:no-repeat;background-attachment:fixed;
    min-height:100vh;padding:20px
  }
  .wrap{max-width:760px;margin:0 auto}
  .header{background:linear-gradient(135deg,#3B0764,#6B21A8);border-radius:12px;padding:24px 28px;text-align:center;margin-bottom:20px}
  .header img{height:56px;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
  .header h1{color:#fff;font-size:1.25rem;margin-bottom:4px}
  .header p{color:#EAB308;font-size:.85rem;font-weight:700}

  .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 24px rgba(0,0,0,.2);margin-bottom:16px}

  .dias-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  @media(max-width:480px){.dias-grid{grid-template-columns:1fr}}
  .dia-btn{border:2px solid #DDD6FE;border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:#FAFAFF;transition:.15s}
  .dia-btn:hover{border-color:#6B21A8;background:#F5F0FF}
  .dia-btn .dia-nombre{font-weight:800;color:#3B0764;font-size:1rem}
  .dia-btn .dia-fecha{font-size:.78rem;color:#888;margin-top:2px}
  .dia-btn .dia-resumen{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chip{font-size:.68rem;font-weight:800;padding:2px 8px;border-radius:99px}
  .chip-ok{background:#DCFCE7;color:#16A34A}
  .chip-vivo{background:#FEF3C7;color:#92400E}
  .chip-falta{background:#FEE2E2;color:#B91C1C}
  .chip-total{background:#EDE9FE;color:#6B21A8}

  .topbar-dia{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .btn-volver{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#6B21A8}
  .titulo-dia{font-weight:800;color:#3B0764;font-size:1.05rem}
  .resumen-dia{font-size:.78rem;color:#555;margin-top:2px}

  .filtros{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .filtro-btn{border:1.5px solid #DDD6FE;background:#FAFAFF;color:#6B21A8;font-size:.75rem;font-weight:700;padding:6px 12px;border-radius:99px;cursor:pointer}
  .filtro-btn.activo{background:#6B21A8;color:#fff;border-color:#6B21A8}

  .buscador{position:relative;margin-bottom:14px}
  .buscador input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid #DDD6FE;border-radius:10px;font-size:.95rem;outline:none}
  .buscador input:focus{border-color:#6B21A8}
  .buscador-icono{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9CA3AF}
  .resultados-info{font-size:.78rem;color:#888;margin-bottom:10px}

  .item-row{border:1px solid #EDE9FE;border-radius:10px;padding:10px 14px;margin-bottom:8px}
  .item-top{display:flex;gap:10px;align-items:flex-start}
  .item-num{background:#EDE9FE;color:#6B21A8;font-weight:800;font-size:.8rem;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .item-obra{font-weight:700;color:#3B0764;font-size:.92rem}
  .item-meta{font-size:.75rem;color:#888;margin-top:2px}
  .item-estado{margin-top:8px}
  .badge-ok{display:inline-block;background:#DCFCE7;color:#16A34A;border:1px solid #BBF7D0;border-radius:99px;padding:5px 12px;font-size:.75rem;font-weight:700}
  .badge-vivo{display:inline-block;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;border-radius:99px;padding:5px 12px;font-size:.75rem;font-weight:700}
  .badge-falta{display:inline-block;background:#FEE2E2;color:#B91C1C;border:1px solid #FECACA;border-radius:99px;padding:5px 12px;font-size:.75rem;font-weight:700}
  .link-escuchar{margin-left:8px;font-size:.75rem;color:#6B21A8;font-weight:700;text-decoration:none}
  .link-escuchar:hover{text-decoration:underline}

  .loading{text-align:center;padding:30px;color:#6B21A8;font-size:.9rem}
  .empty-box{text-align:center;padding:30px;color:#888;font-size:.88rem}
  .btn-refrescar{background:none;border:1px solid #DDD6FE;color:#6B21A8;padding:6px 14px;border-radius:99px;font-size:.78rem;cursor:pointer;margin-left:auto}
  .nota{font-size:.72rem;color:#aaa;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <img src="logo.png" alt="PULSO 2026" onerror="this.style.display='none'"/>
    <h1>Panel de Música por Día</h1>
    <p>PULSO Festival Internacional de Danza 2026 · uso interno</p>
  </div>

  <!-- SELECCIÓN DE DÍA -->
  <div class="card" id="vista-dias">
    <div class="dias-grid" id="dias-grid">
      <div class="loading">Cargando...</div>
    </div>
  </div>
  <div class="nota">Lee en vivo desde el Orden de cada día (mismo dato que ve el público). No hace falta "actualizar" nada antes de abrir esto.</div>

  <!-- DETALLE DE UN DÍA -->
  <div class="card" id="vista-orden" style="display:none">
    <div class="topbar-dia">
      <button class="btn-volver" onclick="volverADias()">←</button>
      <div>
        <div class="titulo-dia" id="titulo-dia"></div>
        <div class="resumen-dia" id="resumen-dia"></div>
      </div>
      <button class="btn-refrescar" onclick="abrirDia(DIA_ACTUAL, true)">↻ Refrescar</button>
    </div>
    <div class="filtros">
      <button class="filtro-btn activo" data-f="todos" onclick="setFiltro('todos')">Todos</button>
      <button class="filtro-btn" data-f="falta" onclick="setFiltro('falta')">❌ Falta música</button>
      <button class="filtro-btn" data-f="vivo" onclick="setFiltro('vivo')">🎤 En vivo</button>
      <button class="filtro-btn" data-f="ok" onclick="setFiltro('ok')">✅ Con música</button>
    </div>
    <div class="buscador">
      <span class="buscador-icono">🔍</span>
      <input type="text" id="buscador" placeholder="Buscar por obra o academia..." oninput="renderLista()"/>
    </div>
    <div class="resultados-info" id="resultados-info"></div>
    <div id="lista-orden"><div class="loading">Cargando...</div></div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiBaoLqFqCVAm44URLDZFKXMYPaL0UlUjStOso_vyeC8UdDqVuw3T_SyjzHLbRqxjDRQ/exec";
const DIAS = [
  {key:"jue", nombre:"Jueves", fecha:"10 Septiembre"},
  {key:"vie", nombre:"Viernes", fecha:"11 Septiembre"},
  {key:"sab", nombre:"Sábado", fecha:"12 Septiembre"},
  {key:"dom", nombre:"Domingo", fecha:"13 Septiembre"},
];
let ITEMS_DIA = [];
let DIA_ACTUAL = '';
let FILTRO_ACTUAL = 'todos';
const CACHE_RESUMEN = {};

function normalizar(s){ return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function extraerIdDrive(url){
  if(!url) return '';
  const m = url.match(/[-\w]{25,}/);
  return m ? m[0] : '';
}

async function cargarResumenDia(dia){
  try{
    const r = await fetch(SCRIPT_URL+'?accion=getOrdenPreviewAdmin&dia='+dia+'&_='+Date.now());
    const json = await r.json();
    const items = json.items || [];
    let ok=0, vivo=0, falta=0;
    items.forEach(it=>{
      if(it.en_vivo) vivo++;
      else if(it.musica_url) ok++;
      else falta++;
    });
    CACHE_RESUMEN[dia] = {total: items.length, ok, vivo, falta, items};
    return CACHE_RESUMEN[dia];
  }catch(e){
    CACHE_RESUMEN[dia] = {total:0, ok:0, vivo:0, falta:0, items:[], error:true};
    return CACHE_RESUMEN[dia];
  }
}

async function iniciar(){
  const grid = document.getElementById('dias-grid');
  grid.innerHTML = DIAS.map(d=>`<div class="dia-btn" id="dia-btn-${d.key}" onclick="abrirDia('${d.key}')">
    <div class="dia-nombre">${d.nombre}</div>
    <div class="dia-fecha">${d.fecha}</div>
    <div class="dia-resumen" id="dia-resumen-${d.key}"><span class="loading" style="padding:0;font-size:.7rem">cargando...</span></div>
  </div>`).join('');

  for (const d of DIAS){
    const res = await cargarResumenDia(d.key);
    const el = document.getElementById('dia-resumen-'+d.key);
    if(res.error){ el.innerHTML = '<span class="chip chip-falta">Error al cargar</span>'; continue; }
    if(res.total === 0){ el.innerHTML = '<span class="chip chip-total">Sin obras cargadas</span>'; continue; }
    el.innerHTML = `<span class="chip chip-total">${res.total} obras</span>`
      + (res.ok ? `<span class="chip chip-ok">✅ ${res.ok}</span>` : '')
      + (res.vivo ? `<span class="chip chip-vivo">🎤 ${res.vivo}</span>` : '')
      + (res.falta ? `<span class="chip chip-falta">❌ ${res.falta}</span>` : '');
  }
}

async function abrirDia(dia, forzarRefresco){
  DIA_ACTUAL = dia;
  const info = DIAS.find(d=>d.key===dia);
  document.getElementById('vista-dias').style.display = 'none';
  document.getElementById('vista-orden').style.display = 'block';
  document.getElementById('titulo-dia').textContent = info.nombre+' '+info.fecha;
  document.getElementById('buscador').value = '';
  FILTRO_ACTUAL = 'todos';
  document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.toggle('activo', b.dataset.f==='todos'));
  document.getElementById('lista-orden').innerHTML = '<div class="loading">Cargando...</div>';

  const res = (forzarRefresco || !CACHE_RESUMEN[dia]) ? await cargarResumenDia(dia) : CACHE_RESUMEN[dia];
  if(res.error){
    document.getElementById('lista-orden').innerHTML = '<div class="empty-box">No se pudo cargar este día. Probá "Refrescar".</div>';
    document.getElementById('resumen-dia').textContent = '';
    ITEMS_DIA = [];
    return;
  }
  ITEMS_DIA = res.items;
  document.getElementById('resumen-dia').textContent =
    `${res.total} obras — ✅ ${res.ok} con música · 🎤 ${res.vivo} en vivo · ❌ ${res.falta} faltan`;
  renderLista();
}

function volverADias(){
  document.getElementById('vista-orden').style.display = 'none';
  document.getElementById('vista-dias').style.display = 'block';
}

function setFiltro(f){
  FILTRO_ACTUAL = f;
  document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.toggle('activo', b.dataset.f===f));
  renderLista();
}

function renderLista(){
  const q = normalizar(document.getElementById('buscador').value.trim());
  let items = ITEMS_DIA.slice().sort((a,b)=>(Number(a.numero)||0)-(Number(b.numero)||0));

  items = items.filter(it=>{
    if(FILTRO_ACTUAL==='falta') return !it.en_vivo && !it.musica_url;
    if(FILTRO_ACTUAL==='vivo') return !!it.en_vivo;
    if(FILTRO_ACTUAL==='ok') return !it.en_vivo && !!it.musica_url;
    return true;
  });

  if(q){
    items = items.filter(it => normalizar(it.obra).includes(q) || normalizar(it.academia).includes(q));
  }

  const cont = document.getElementById('lista-orden');
  const infoEl = document.getElementById('resultados-info');
  infoEl.textContent = items.length + ' resultado' + (items.length===1?'':'s');

  if(!items.length){
    cont.innerHTML = '<div class="empty-box">No hay obras que coincidan.</div>';
    return;
  }

  cont.innerHTML = items.map(it=>{
    let badge;
    if(it.en_vivo){
      badge = '<span class="badge-vivo">🎤 En vivo</span>';
    } else if(it.musica_url){
      const fileId = extraerIdDrive(it.musica_url);
      const href = fileId ? ('https://drive.google.com/file/d/'+fileId+'/view') : it.musica_url;
      badge = '<span class="badge-ok">✅ Con música</span><a class="link-escuchar" href="'+href+'" target="_blank" rel="noopener">▶ escuchar</a>';
    } else {
      badge = '<span class="badge-falta">❌ Falta música</span>';
    }
    return `<div class="item-row">
      <div class="item-top">
        <div class="item-num">${escHtml(it.numero)}</div>
        <div>
          <div class="item-obra">${escHtml(it.obra)}</div>
          <div class="item-meta">${escHtml(it.academia)} · ${escHtml(it.modalidad)} · ${escHtml(it.categoria)} · ${escHtml(it.tipo)}</div>
        </div>
      </div>
      <div class="item-estado">${badge}</div>
    </div>`;
  }).join('');
}

function escHtml(s){
  return (s===undefined||s===null?'':s.toString()).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

iniciar();
</script>
</body>
</html>
