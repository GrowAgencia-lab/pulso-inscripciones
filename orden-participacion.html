<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Orden de Participación — PULSO 2026</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',Arial,sans-serif;
    background-color:#51155D;
    background-image:url('fondo.jpg');
    background-size:cover;background-position:center top;background-repeat:no-repeat;background-attachment:fixed;
    min-height:100vh;padding:20px
  }
  .wrap{max-width:640px;margin:0 auto}
  .header{background:linear-gradient(135deg,#3B0764,#6B21A8);border-radius:12px;padding:24px 28px;text-align:center;margin-bottom:20px}
  .header img{height:56px;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
  .header h1{color:#fff;font-size:1.25rem;margin-bottom:4px}
  .header p{color:#EAB308;font-size:.85rem;font-weight:700}

  .card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 24px rgba(0,0,0,.2);margin-bottom:16px}

  .dias-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  @media(max-width:480px){.dias-grid{grid-template-columns:1fr}}
  .dia-btn{border:2px solid #DDD6FE;border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:#FAFAFF;transition:.15s}
  .dia-btn:hover{border-color:#6B21A8;background:#F5F0FF}
  .dia-btn .dia-nombre{font-weight:800;color:#3B0764;font-size:1rem}
  .dia-btn .dia-fecha{font-size:.78rem;color:#888;margin-top:2px}
  .dia-btn.deshabilitado{opacity:.55;cursor:default;background:#F3F3F3}
  .dia-btn.deshabilitado:hover{border-color:#DDD6FE;background:#F3F3F3}
  .badge-prox{display:inline-block;margin-top:6px;font-size:.68rem;font-weight:700;background:#E5E7EB;color:#555;padding:2px 10px;border-radius:99px}

  .topbar-dia{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .btn-volver{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#6B21A8}
  .titulo-dia{font-weight:800;color:#3B0764;font-size:1.05rem}

  .buscador{position:relative;margin-bottom:14px}
  .buscador input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid #DDD6FE;border-radius:10px;font-size:.95rem;outline:none}
  .buscador input:focus{border-color:#6B21A8}
  .buscador-icono{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9CA3AF}
  .resultados-info{font-size:.78rem;color:#888;margin-bottom:10px}

  .bloque-header{background:linear-gradient(90deg,#3B0764,#6B21A8);color:#fff;padding:8px 14px;border-radius:10px 10px 0 0;font-size:.8rem;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
  .bloque-jurado{font-weight:400;font-size:.72rem;opacity:.9}
  .item-row{border:1px solid #EDE9FE;border-top:none;padding:10px 14px}
  .item-row:last-child{border-radius:0 0 10px 10px}
  .item-top{display:flex;gap:10px;align-items:flex-start}
  .item-num{background:#EDE9FE;color:#6B21A8;font-weight:800;font-size:.8rem;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .item-obra{font-weight:700;color:#3B0764;font-size:.92rem}
  .item-meta{font-size:.75rem;color:#888;margin-top:2px}
  .item-part{font-size:.75rem;color:#555;margin-top:4px}
  .btn-musica{margin-top:8px;background:#F3E8FF;color:#6B21A8;border:1px solid #DDD6FE;border-radius:99px;padding:5px 12px;font-size:.75rem;font-weight:700;cursor:pointer}
  .btn-musica:hover{background:#EDE9FE}
  .musica-player{margin-top:8px;display:none}
  .musica-player.abierto{display:block}
  .musica-player iframe{width:100%;height:80px;border:none;border-radius:8px}

  .loading{text-align:center;padding:30px;color:#6B21A8;font-size:.9rem}
  .empty-box{text-align:center;padding:30px;color:#888;font-size:.88rem}
  .btn-salir{background:none;border:1px solid #DDD6FE;color:#6B21A8;padding:6px 14px;border-radius:99px;font-size:.78rem;cursor:pointer;margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <img src="logo.png" alt="PULSO 2026" onerror="this.style.display='none'"/>
    <h1>Orden de Participación</h1>
    <p>PULSO Festival Internacional de Danza 2026</p>
  </div>

  <!-- SELECCIÓN DE DÍA -->
  <div class="card" id="vista-dias">
    <div class="dias-grid" id="dias-grid">
      <div class="loading">Cargando...</div>
    </div>
  </div>

  <!-- ORDEN DE UN DÍA -->
  <div class="card" id="vista-orden" style="display:none">
    <div class="topbar-dia">
      <button class="btn-volver" onclick="volverADias()">←</button>
      <div class="titulo-dia" id="titulo-dia"></div>
    </div>
    <div class="buscador">
      <span class="buscador-icono">🔍</span>
      <input type="text" id="buscador" placeholder="Buscar por obra, academia, participante o coreógrafo..." oninput="filtrarOrden()"/>
    </div>
    <div class="resultados-info" id="resultados-info"></div>
    <div id="lista-orden"><div class="loading">Cargando...</div></div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiBaoLqFqCVAm44URLDZFKXMYPaL0UlUjStOso_vyeC8UdDqVuw3T_SyjzHLbRqxjDRQ/exec";

const DIAS = [
  {key:"jue", nombre:"Jueves", fecha:"10 de Septiembre"},
  {key:"vie", nombre:"Viernes", fecha:"11 de Septiembre"},
  {key:"sab", nombre:"Sábado", fecha:"12 de Septiembre"},
  {key:"dom", nombre:"Domingo", fecha:"13 de Septiembre"},
];

let ITEMS_DIA = [];

async function cargarDias(){
  const el = document.getElementById('dias-grid');
  let config = {};
  try{
    const r = await fetch(SCRIPT_URL+'?accion=getConfigOrdenPublico&_='+Date.now());
    const json = await r.json();
    config = json.config || {};
  }catch(e){}

  el.innerHTML = DIAS.map(d=>{
    const habilitado = !!config[d.key];
    return `<div class="dia-btn ${habilitado?'':'deshabilitado'}" onclick="${habilitado?`abrirDia('${d.key}')`:''}">
      <div class="dia-nombre">Orden del día ${d.nombre}</div>
      <div class="dia-fecha">${d.fecha}</div>
      ${habilitado?'':'<div class="badge-prox">Disponible en breve</div>'}
    </div>`;
  }).join('');
}
cargarDias();

async function abrirDia(dia){
  const info = DIAS.find(d=>d.key===dia);
  document.getElementById('vista-dias').style.display = 'none';
  document.getElementById('vista-orden').style.display = 'block';
  document.getElementById('titulo-dia').textContent = 'Orden del día '+info.nombre+' — '+info.fecha;
  document.getElementById('buscador').value = '';
  document.getElementById('lista-orden').innerHTML = '<div class="loading">Cargando...</div>';

  try{
    const r = await fetch(SCRIPT_URL+'?accion=getOrdenPublico&dia='+dia+'&_='+Date.now());
    const json = await r.json();
    if(!json.habilitado){
      document.getElementById('lista-orden').innerHTML = '<div class="empty-box">Este orden todavía no está disponible. Volvé a intentarlo más adelante.</div>';
      document.getElementById('resultados-info').textContent = '';
      ITEMS_DIA = [];
      return;
    }
    ITEMS_DIA = json.items || [];
    renderListaOrden(ITEMS_DIA);
  }catch(e){
    document.getElementById('lista-orden').innerHTML = '<div class="empty-box">Error al cargar. Intentá de nuevo.</div>';
  }
}

function volverADias(){
  document.getElementById('vista-orden').style.display = 'none';
  document.getElementById('vista-dias').style.display = 'block';
}

function normalizar(s){
  return (s||'').toString().trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function filtrarOrden(){
  const q = normalizar(document.getElementById('buscador').value);
  if(!q){
    renderListaOrden(ITEMS_DIA);
    return;
  }
  const filtrados = ITEMS_DIA.filter(it=>
    normalizar(it.obra).includes(q) ||
    normalizar(it.academia).includes(q) ||
    normalizar(it.participantes).includes(q) ||
    normalizar(it.coreografo).includes(q)
  );
  renderListaOrden(filtrados, true);
}

function renderListaOrden(items, esBusqueda){
  const el = document.getElementById('lista-orden');
  const infoEl = document.getElementById('resultados-info');

  if(!items.length){
    el.innerHTML = '<div class="empty-box">No se encontraron resultados.</div>';
    infoEl.textContent = esBusqueda ? '0 resultados' : '';
    return;
  }

  infoEl.textContent = esBusqueda ? items.length+' resultado(s)' : items.length+' obras en total';

  let html = '';
  let bloqueActual = null;
  items.forEach(it=>{
    if(it.bloque !== bloqueActual){
      bloqueActual = it.bloque;
      html += `<div class="bloque-header">
        <span>${escHtml(it.bloque)}</span>
        <span class="bloque-jurado">👨‍⚖️ ${it.jurado?escHtml(it.jurado):'Jurado a confirmar'}</span>
      </div>`;
    }
    const fileId = extraerIdDrive(it.musica_url);
    html += `<div class="item-row">
      <div class="item-top">
        <div class="item-num">${escHtml(it.numero)}</div>
        <div style="flex:1">
          <div class="item-obra">${escHtml(it.obra)}</div>
          <div class="item-meta">${escHtml(it.academia)} · ${escHtml(it.modalidad)} · ${escHtml(it.categoria)} · ${escHtml(it.tipo)}</div>
          ${it.coreografo?`<div class="item-meta">Coreógrafo/a: ${escHtml(it.coreografo)}</div>`:''}
          <div class="item-part">${escHtml(it.participantes)}</div>
          ${fileId?`<button class="btn-musica" onclick="toggleMusica(this)">🎵 Escuchar música</button>
          <div class="musica-player"><iframe src="" data-src="https://drive.google.com/file/d/${fileId}/preview"></iframe></div>`:''}
        </div>
      </div>
    </div>`;
  });
  el.innerHTML = html;
}

function extraerIdDrive(url){
  if(!url) return '';
  const m = url.toString().match(/\/d\/([a-zA-Z0-9_-]+)/) || url.toString().match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : '';
}

function toggleMusica(btn){
  const player = btn.nextElementSibling;
  const iframe = player.querySelector('iframe');
  const abierto = player.classList.contains('abierto');
  if(abierto){
    player.classList.remove('abierto');
    iframe.setAttribute('src', '');
    btn.textContent = '🎵 Escuchar música';
  }else{
    if(!iframe.getAttribute('src')) iframe.setAttribute('src', iframe.dataset.src);
    player.classList.add('abierto');
    btn.textContent = '✕ Cerrar reproductor';
  }
}

function escHtml(str){
  return (str===null||str===undefined?'':String(str)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
